name: Post Tweet to X

on:
  repository_dispatch:
    types: [post_tweet, post_thread, post_retweet]
  workflow_dispatch:
    inputs:
      tweet_text:
        description: 'Texto del tweet'
        required: true
      reply_to:
        description: 'ID del tweet al que responder (opcional)'
        required: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install playwright pytz

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Post tweet via Playwright
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          TWEET_TEXT: ${{ github.event.client_payload.text || github.event.inputs.tweet_text }}
          REPLY_TO: ${{ github.event.client_payload.reply_to || github.event.inputs.reply_to || '' }}
          ACTION: ${{ github.event.client_payload.action || 'tweet' }}
          TWEET_ID: ${{ github.event.client_payload.tweet_id || '' }}
          FOLLOW_USERNAMES: ${{ github.event.client_payload.usernames || '' }}
          TWEETS_THREAD: ${{ github.event.client_payload.tweets_thread || '' }}
          QUERY: ${{ github.event.client_payload.query || '' }}
          CALLBACK_PATH: ${{ github.event.client_payload.callback_path || '' }}
          CALLBACK_EXTRA: ${{ toJson(github.event.client_payload.extra) }}
          N8N_WEBHOOK: ${{ github.event.client_payload.n8n_webhook || 'https://n8n.teamworkz.co/webhook' }}
        run: python post_tweet.py

      - name: Show result
        if: always()
        run: cat result.json 2>/dev/null || echo "Sin resultado"
