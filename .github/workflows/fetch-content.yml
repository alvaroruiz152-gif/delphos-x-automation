name: Fetch X Content

on:
  repository_dispatch:
    types: [fetch_mentions, fetch_account_tweets, do_retweet, do_quote_tweet, do_reply]
  workflow_dispatch:
    inputs:
      mode:
        description: "mentions | do_retweet | do_quote_tweet | do_reply"
        required: true
        default: "mentions"
      tweet_id:
        description: "Tweet ID (for do_retweet / do_quote_tweet)"
        required: false
      quote_text:
        description: "Comment text (for do_quote_tweet)"
        required: false
      reply_tweet_id:
        description: "Tweet ID to reply to (for do_reply)"
        required: false
      reply_text:
        description: "Reply text (for do_reply)"
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install httpx twikit

      - name: Run
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          FETCH_MODE: ${{ github.event.client_payload.mode || github.event.inputs.mode || 'mentions' }}
          TWEET_ID: ${{ github.event.client_payload.tweet_id || github.event.inputs.tweet_id || '' }}
          QUOTE_TEXT: ${{ github.event.client_payload.quote_text || github.event.inputs.quote_text || '' }}
          REPLY_TWEET_ID: ${{ github.event.client_payload.reply_tweet_id || github.event.inputs.reply_tweet_id || '' }}
          REPLY_TEXT: ${{ github.event.client_payload.reply_text || github.event.inputs.reply_text || '' }}
          ACCOUNT: ${{ github.event.client_payload.account || '' }}
          N8N_WEBHOOK: ${{ github.event.client_payload.n8n_webhook || 'https://n8n.teamworkz.co/webhook' }}
        run: python fetch_content.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.run_id }}
          path: result.json
          retention-days: 1

      - name: Print result
        run: cat result.json
